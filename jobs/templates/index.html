<!DOCTYPE html>
<html>
<head>
    <title>AI Content Generator</title>

    <style>
        body{
            font-family:Arial,Helvetica,sans-serif;
            background:#f5f5f5;
        }

        .container{
            width:700px;
            margin:40px auto;
            background:white;
            padding:25px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,.15);
        }

        h2{
            text-align:center;
        }

        label{
            display:block;
            margin-top:15px;
            font-weight:bold;
        }

        input,textarea{
            width:100%;
            padding:10px;
            margin-top:5px;
        }

        button{
            margin-top:20px;
            width:100%;
            padding:12px;
            background:#0d6efd;
            color:white;
            border:none;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:#084298;
        }

        #result{
            margin-top:30px;
            display:none;
        }

        img{
            max-width:100%;
            margin-top:10px;
        }

        pre{
            white-space:pre-wrap;
        }
    </style>
</head>

<body>

<div class="container">

<h2>AI Content Generation Engine</h2>

<form id="generateForm">

<label>Product Name</label>
<input type="text" name="product_name" required>

<label>Description</label>
<textarea name="description" rows="5" required></textarea>

<label>Reference Image</label>
<input type="file" name="reference_image">

<button type="submit">
Generate Content
</button>

</form>

<div id="result">

<h3>Status</h3>

<p id="status"></p>

<h3>Generated Prompt</h3>

<pre id="prompt"></pre>

<h3>Generated Image</h3>

<img id="generatedImage">

</div>

</div>

<script>

const form=document.getElementById("generateForm");

form.addEventListener("submit",async function(e){

e.preventDefault();

let formData=new FormData(form);

let response=await fetch("/api/generate/",{

method:"POST",

body:formData

});

let data=await response.json();

checkStatus(data.job_id);

});


async function checkStatus(jobId){

let interval=setInterval(async()=>{

let response=await fetch(`/api/status/${jobId}/`);

let data=await response.json();

document.getElementById("result").style.display="block";

document.getElementById("status").innerText=data.status;

if(data.status==="COMPLETED"){

document.getElementById("prompt").innerText=data.generated_prompt;

document.getElementById("generatedImage").src=data.generated_image_url;

clearInterval(interval);

}

},2000);

}

</script>

</body>
</html>
